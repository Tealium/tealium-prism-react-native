buildscript {
  ext.getExtOrDefault = { prop, fallback ->
    return rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.1.20')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

repositories {
  maven { url "https://maven.tealiumiq.com/android/releases/" }
}

android {
  namespace "com.tealium.prism.reactnative.firebase"

  compileSdkVersion getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 36)
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // The Firebase dispatcher auto-registers its factory via its AndroidManifest
  // ComponentDiscoveryService entry, merged in by adding this dependency.
  // Firebase (BoM + firebase-analytics) comes in transitively, so the app does
  // not need to declare it.
  implementation "com.tealium.prism:firebase:0.2.0"
}
