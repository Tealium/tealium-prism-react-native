buildscript {
  ext.TealiumPrismReactNative = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return TealiumPrismReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

repositories {
  maven { url "https://maven.tealiumiq.com/android/releases/" }
}

android {
  namespace "com.tealium.prism.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  // Prism's DataItem/DataObject rely on Android's org.json, so unit tests run under Robolectric.
  // Mirrors the Prism Kotlin SDK's core module test setup.
  testOptions {
    unitTests {
      returnDefaultValues = true
      includeAndroidResources = true
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.tealium.prism:prism-core:0.6.0"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.13"
}
