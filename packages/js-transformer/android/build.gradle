buildscript {
  ext.getExtOrDefault = { prop, fallback ->
    return rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '2.1.20')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

repositories {
  maven { url "https://maven.tealiumiq.com/android/releases/" }
}

android {
  namespace "com.tealium.prism.reactnative.jstransformer"

  compileSdkVersion getExtOrDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 36)
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Rhino build of the JavaScript transformer. The base transformer ships no JS
  // engine and registers nothing on its own, so on Android we depend on the
  // Rhino variant, which transitively pulls the base transformer plus the Rhino
  // engine and registers the transformer factory via its AndroidManifest
  // ComponentDiscoveryService entry. This mirrors iOS (JavaScriptCore) so the
  // single package works on both platforms with no extra install.
  implementation "com.tealium.prism:prism-js-transformer-rhino:0.1.0"
}
